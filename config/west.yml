manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: tact-software
      url-base: https://github.com/tact-software
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: v0.3-branch
      import: app/west.yml
    # 自アカウントのフォーク (Dist16384系、Cygnusと同一ドライバ・同一コミット)。
    # AUTO_RECOVERY (初期化リトライ + 3秒毎ヘルスチェックによる自動再初期化) が
    # 熱起因のセンサー脱落への対策になる。問題が出た場合は
    # CONFIG_PMW3610_HEALTH_VERIFY_CONFIG=n で読み戻し検証だけ無効化できる。
    - name: zmk-pmw3610-driver
      remote: tact-software
      revision: c5e190c90bd03dc450105fde12d676bc34e6825e
  self:
    path: config
